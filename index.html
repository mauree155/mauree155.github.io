<style>
  :root {
    --ink: #17302C;
    --muted: #4E6360;
    --paper: #F7FAF8;
    --mint: #DDEDE7;
    --teal: #0E6B5E;
    --amber: #C98A12;
    --line: #C9DAD4;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Figtree", system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  a { color: var(--teal); text-underline-offset: 3px; }
  a:focus-visible, .btn:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  h1, h2, h3 { font-family: "Bricolage Grotesque", sans-serif; line-height: 1.1; margin: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* Navigation */
  nav { padding: 20px 0; }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; }
  .links { display: flex; gap: 20px; }
  .links a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 0.95rem; }
  .links a:hover { color: var(--teal); }

  /* Hero */
  .hero { padding: 40px 0 72px; }
  .hero .wrap { display: grid; grid-template-columns: 1fr; gap: 32px; align-items: end; }
  .hero-text { max-width: 640px; }
  .hero h1 { font-size: clamp(2.4rem, 7vw, 4.25rem); font-weight: 700; letter-spacing: -0.02em; }
  .hero p.intro { font-size: 1.2rem; color: var(--muted); margin: 20px 0 28px; max-width: 34em; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-block; padding: 13px 22px; border-radius: 8px;
    font-weight: 600; text-decoration: none; font-size: 1rem;
  }
  .btn-primary { background: var(--teal); color: #fff; }
  .btn-primary:hover { background: #0A574C; }
  .btn-plain { color: var(--ink); border: 1.5px solid var(--ink); }
  .btn-plain:hover { background: var(--ink); color: var(--paper); }
  .portrait {
    width: 100%; max-width: 300px; aspect-ratio: 4 / 5;
    background: var(--mint); border-radius: 160px 160px 12px 12px;
    overflow: hidden; display: flex; align-items: flex-end;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block; }
  @media (min-width: 820px) {
    .hero { padding: 72px 0 104px; }
    .hero .wrap { grid-template-columns: 1fr 300px; gap: 64px; }
  }
  @media (max-width: 819px) {
    .portrait { max-width: 180px; order: -1; }
  }
  @media (max-width: 480px) {
    .links { gap: 14px; }
    .links a { font-size: 0.9rem; }
    .brand { white-space: nowrap; font-size: 1.05rem; }
  }

  /* Sections */
  section.block { padding: 72px 0; border-top: 1px solid var(--line); }
  .section-head { max-width: 640px; margin-bottom: 40px; }
  .section-head h2 { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 700; letter-spacing: -0.01em; }
  .section-head p { color: var(--muted); margin: 12px 0 0; }

  /* Projects: each one leads with its finding, drawn as a small chart */
  .project { display: grid; grid-template-columns: 1fr; gap: 24px; padding: 40px 0; border-top: 1px solid var(--line); }
  .project:first-of-type { border-top: 0; padding-top: 0; }
  .finding { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; align-self: start; }
  .finding .stat { font-family: "Bricolage Grotesque", sans-serif; font-size: 1.25rem; font-weight: 700; line-height: 1.3; margin: 0 0 20px; }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
  .bar-label strong { color: var(--ink); }
  .bar { height: 14px; background: var(--mint); border-radius: 7px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--teal); border-radius: 7px; }
  .bar.alt span { background: #8FB3AA; }
  .chart { width: 100%; height: auto; display: block; border-radius: 8px; }
  .source { font-size: 0.82rem; color: var(--muted); margin: 16px 0 0; }
  .detail h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
  .detail .tools { color: var(--teal); font-weight: 600; font-size: 0.95rem; margin: 0 0 14px; }
  .detail p { margin: 0 0 14px; max-width: 36em; }
  @media (min-width: 820px) {
    .project { grid-template-columns: 360px 1fr; gap: 56px; }
  }

  /* Experience timeline */
  .timeline { list-style: none; margin: 0; padding: 0; max-width: 760px; }
  .timeline li { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 22px 0; border-top: 1px solid var(--line); }
  .timeline li:first-child { border-top: 0; padding-top: 0; }
  .when { color: var(--muted); font-size: 0.92rem; font-weight: 500; }
  .role { font-weight: 600; font-size: 1.1rem; }
  .org { color: var(--muted); }
  .timeline p { margin: 8px 0 0; }
  @media (min-width: 820px) {
    .timeline li { grid-template-columns: 180px 1fr; gap: 32px; }
  }

  /* Education and skills */
  .two-col { display: grid; grid-template-columns: 1fr; gap: 48px; }
  @media (min-width: 820px) { .two-col { grid-template-columns: 1fr 1fr; gap: 64px; } }
  .two-col h3 { font-size: 1.3rem; margin-bottom: 16px; }
  .edu { margin-bottom: 20px; }
  .edu .role { font-size: 1.05rem; }
  .skills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
